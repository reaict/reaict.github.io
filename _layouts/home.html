---
layout: default
home: true
---
<style>
  .journal {
    max-width: 620px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    background: #fff;
    color: #111;
    font-family: "Baskerville", "Libre Baskerville", "Times New Roman", Georgia, serif;
    line-height: 1.6;
  }
  .journal .masthead {
    text-align: center;
    border-top: 3px double #111;
    border-bottom: 1px solid #111;
    padding: 18px 0 14px;
    margin-bottom: 40px;
  }
  .journal .masthead h1 {
    margin: 0;
    font-size: 34px;
    font-weight: normal;
    letter-spacing: 0.08em;
    font-variant: small-caps;
  }
  .journal .section-title {
    font-size: 21px;
    text-transform: uppercase;
    text-align: center;
    margin: 0 0 28px;
  }
  .journal ol {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .journal li {
    border-bottom: 1px solid #111;
    padding: 14px 0;
  }
  .journal li:first-child {
    padding-top: 0;
  }
  .journal .entry-title {
    display: block;
    font-size: 18px;
    font-family: "Old Standard TT", "Times New Roman", serif;
    color: #111;
    text-decoration: none;
  }
  .journal .entry-title:hover {
    text-decoration: underline;
  }
  .journal .entry-date {
    display: block;
    font-style: italic;
    font-size: 14px;
    color: #444;
    margin-top: 2px;
  }
</style>

<div class="journal">
  {%- if page.title -%}
    <header class="masthead">
      <h1>{{ page.title | escape }}</h1>
    </header>
  {%- endif -%}

  {{ content }}
</div>
