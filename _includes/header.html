<header class="site-header" role="banner">
  <div class="wrapper" style="display: flex; align-items: center; justify-content: center; position: relative;">
    {%- if site.logo -%}
      <img src="{{ "/assets/" | append: site.logo | relative_url }}" alt="logo" style="height: 45px; position: absolute; left: 0;">
    {%- endif -%}
    <img
      src="{{ '/assets/header_reaict.png' | relative_url }}"
      alt="header_reaict"
      style="height: 45px; position: absolute; left: 50%; transform: translateX(-50%);"
    >
  </div>
</header>
